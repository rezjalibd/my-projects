<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پروژه‌های من</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>پروژه‌های من</h1>
    <p>پنل مدیریت پروژه‌های نیلای — My Projects</p>
  </div>
</header>
<main class="wrap">
  <section id="login-view" class="login card">
    <h2>ورود به پنل</h2>
    <p class="muted">برای دیدن پروژه‌ها رمز پنل را وارد کنید.</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="رمز پنل" autocomplete="current-password">
      <button class="btn primary" type="submit">ورود</button>
    </form>
    <div id="login-error" class="error" hidden></div>
  </section>

  <section id="app-view" hidden>
    <div class="toolbar">
      <button class="btn primary" id="new-project-btn">+ پروژه جدید</button>
      <button class="btn ghost" id="logout-btn">خروج</button>
    </div>
    <div id="list-view">
      <div id="project-grid" class="grid"></div>
    </div>
    <div id="detail-view" hidden></div>
  </section>
</main>

<div id="wizard-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>پروژه جدید</h2>
      <button class="mini" id="wiz-close">✕</button>
    </div>
    <div id="wizard-body"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="wiz-back">مرحله قبل</button>
      <button class="btn primary" id="wiz-next">مرحله بعد</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>

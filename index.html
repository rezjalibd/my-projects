<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>پروژه‌های من</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <section id="login-view" class="login">
    <h2>ورود به پنل</h2>
    <p class="muted">برای دیدن پروژه‌ها رمز پنل را وارد کنید.</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="رمز پنل" autocomplete="current-password">
      <button class="btn primary" type="submit">ورود</button>
    </form>
    <div id="login-error" class="error" hidden></div>
  </section>

  <section id="app-view" hidden>
    <header class="list-head">
      <h1>پروژه‌های من</h1>
      <button class="btn ghost" id="logout-btn">خروج</button>
    </header>
    <div id="list-view">
      <div id="summary" class="summary" hidden>
        <div class="cell"><div class="num" id="sum-total">۰</div><div class="lbl">کل پروژه‌ها</div></div>
        <div class="cell"><div class="num" id="sum-doing">۰</div><div class="lbl">در حال انجام</div></div>
        <div class="cell"><div class="num" id="sum-done">۰</div><div class="lbl">تکمیل‌شده</div></div>
      </div>
      <div class="search-row"><input id="search-input" placeholder="جست‌جو در پروژه‌ها…" type="search"></div>
      <div id="filter-chips" class="filters"></div>
      <div id="project-grid" class="list"></div>
    </div>
    <div id="detail-view" hidden></div>
    <button class="fab" id="new-project-btn">+ پروژه‌ی جدید</button>
  </section>

  <section id="wizard-view" class="wiz-wrap" hidden>
    <header class="wizard-head">
      <button class="back-btn" id="wiz-cancel">انصراف</button>
      <h1>پروژه‌ی جدید</h1>
      <span class="wizard-counter" id="wiz-counter">گام ۱ از ۶</span>
    </header>
    <div class="wiz-segments" id="wiz-segments" role="progressbar"></div>
    <h2 class="wiz-step-title" id="wiz-step-title"></h2>
    <p class="wiz-step-desc" id="wiz-step-desc"></p>
    <div id="wiz-confirm" class="wiz-confirm" role="alertdialog" hidden>
      <b>خروج از ساخت پروژه؟</b>
      <p class="muted">اطلاعات واردشده ذخیره نمی‌شود.</p>
      <div class="row">
        <button class="btn danger" id="wiz-confirm-exit">بستن بدون ذخیره</button>
        <button class="btn" id="wiz-confirm-stay">ادامه دادن</button>
      </div>
    </div>
    <div id="wizard-body" class="wiz-body"></div>
    <nav class="wiz-nav"><div class="wiz-nav-inner">
      <button class="btn" id="wiz-back">قبلی</button>
      <button class="btn primary" id="wiz-next">گام بعد</button>
    </div></nav>
  </section>
</main>

<script src="app.js" defer></script>
</body>
</html>
